<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="shortcut icon" href="/icons/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

    <meta name="apple-mobile-web-app-title" content="Arurem" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arurem | Private Asset Ledger</title>

    <!--
      Critical theme boot.

      Both blocks are render-blocking on purpose. React applies the theme in an
      effect, which runs after first paint — without this, a dark-mode user sees
      a light frame before the class lands. The style block covers the gap before
      the stylesheet arrives (Vite injects CSS from JS in dev), so the canvas is
      never painted white.

      The storage key and the two background values must stay in sync with
      src/shared/hooks/useTheme.ts and src/shared/styles/tokens.css.
      src/app/themeBoot.test.ts asserts that they do.
    -->
    <style>
      html {
        background-color: #fbf9f4;
      }
      html.dark {
        background-color: #0b1210;
      }
    </style>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('arurem.theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          // Mirrors resolveTheme() in src/shared/lib/theme.ts: only the literal
          // 'light' and 'dark' are explicit; anything else — including an
          // unrecognised value — defers to the OS preference.
          var dark = stored === 'dark' || (stored !== 'light' && prefersDark);
          var root = document.documentElement;
          root.classList.toggle('dark', dark);
          root.style.colorScheme = dark ? 'dark' : 'light';
        } catch (error) {
          // Private mode or blocked storage: fall through to the light default
          // rather than letting a storage error stop the page from booting.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
